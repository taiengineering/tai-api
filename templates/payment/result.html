<!doctype html>
<html lang="ko"><head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결제 결과 | TAI Safe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet" />
  <style>*{font-family:sans-serif;}body{background:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center;}.result-card{background:#fff;border-radius:1.5rem;box-shadow:0 8px 40px rgba(0,0,0,.1);max-width:480px;width:100%;padding:3rem 2.5rem;text-align:center;}.icon-wrap{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.8rem;margin:0 auto 1.75rem;}.icon-wrap.success{background:#e8f5e9;color:#198754;}.icon-wrap.fail{background:#fef2f2;color:#dc3545;}.detail-table{background:#f8fafc;border-radius:.75rem;padding:1rem 1.25rem;text-align:left;font-size:.88rem;}.detail-row{display:flex;justify-content:space-between;padding:.35rem 0;border-bottom:1px solid #f0f0f0;}.detail-row:last-child{border-bottom:none;}.btn-action{border-radius:.75rem;padding:.75rem 1.5rem;font-size:.95rem;font-weight:700;}.countdown{font-size:.82rem;color:#adb5bd;margin-top:.5rem;}</style>
</head><body>
<div class="result-card" id="rc">
  <div class="d-flex justify-content-center mb-4"><div class="spinner-border text-primary" style="width:3rem;height:3rem;"></div></div>
  <h5 class="fw-bold mb-2">결제 정보 확인 중...</h5><p class="text-body-secondary mb-0">잠시만 기다려 주세요.</p>
</div>
<script>
'use strict';
function getParams(){var p={};new URLSearchParams(location.search).forEach(function(v,k){p[k]=v;});return p;}
function fmt(n){return n?Number(n).toLocaleString()+'원':'-';}
function goHome(){(window.top||window).location.href='https://taieng.co.kr';}
// 결제 실패/취소 시 "다시 시도" 대상 URL: 호출 페이지가 closeUrl 에 retry= 로 실어 보냄(서비스 선택창).
// 없으면 기본 pricing. 자사 도메인/상대경로만 허용(오픈리다이렉트 방지).
function getRetryUrl(){
  var q=getParams();
  var def='https://taieng.co.kr/pricing.html';
  if(!q.retry)return def;
  var r;try{r=decodeURIComponent(q.retry);}catch(e){return def;}
  if(r.indexOf('https://taieng.co.kr')===0||r.charAt(0)==='/')return r;
  return def;
}
// 진단 결제 여부 판별: product_type=DIAGNOSIS 또는 상품명에 법령진단/LDX 포함
function isDiagnosis(p){
  var pt=(p.product_type||'').toUpperCase();
  var gn=(p.goodname||'');
  return pt.indexOf('DIAGNOSIS')>=0 || gn.indexOf('법령진단')>=0 || gn.indexOf('LDX')>=0;
}
// 결제 복귀 qs의 sector(백엔드가 plan_code에서 파생해 전달)를 정규화. 없으면 ''.
function normSector(s){
  var v=(s||'').toString().toUpperCase();
  return (v==='BUILDING'||v==='INDUSTRY'||v==='CONSTRUCTION')?v:'';
}
// 결제 완료 후 진단 상세입력으로 이어가기 (회원 로그인 상태로 oid 들고 진입)
// sector가 있으면 ?paid=<sector> 로 넘겨 free-diagnosis가 섹터 자동지정 + 공정·설비 입력을 바로 띄운다.
// sector가 없으면 하위호환으로 paid=1.
function goDiagnosisInput(oid,sector){
  var sec=normSector(sector);
  var u='https://taieng.co.kr/free-diagnosis?paid='+(sec||'1');
  if(oid)u+='&oid='+encodeURIComponent(oid);
  (window.top||window).location.href=u;
}
function renderOkDiagnosis(p){
  var rc=document.getElementById('rc');
  var sec=normSector(p.sector);
  rc.innerHTML='<div class="icon-wrap success"><i class="ti tabler-circle-check"></i></div>'
    +'<h4 class="fw-bold mb-2">결제가 완료됐습니다.</h4>'
    +'<p class="text-body-secondary mb-4">이제 시설·공정·설비 정보를 입력하면 법령진단이 시작됩니다.</p>'
    +'<div class="detail-table mb-4">'
    +'<div class="detail-row"><span style="color:#6c757d">상품명</span><span style="font-weight:600">'+(p.goodname||'법령진단')+'</span></div>'
    +'<div class="detail-row"><span style="color:#6c757d">결제금액</span><span style="font-weight:600">'+fmt(p.price)+'</span></div>'
    +(p.applnum?'<div class="detail-row"><span style="color:#6c757d">승인번호</span><span style="font-weight:600">'+p.applnum+'</span></div>':'')
    +'</div>'
    +'<button class="btn btn-primary btn-action w-100" onclick="goDiagnosisInput(\''+(p.oid||'')+'\',\''+sec+'\')">상세입력 계속하기 →</button>'
    +'<div class="countdown">입력 중 중단해도 로그인하면 이어서 진행할 수 있습니다.</div>';
}
function renderOk(p){
  // 진단 결제는 홈이 아니라 상세입력으로 유도
  if(isDiagnosis(p)){renderOkDiagnosis(p);return;}
  var rc=document.getElementById('rc'),sec=5,ti;rc.innerHTML='<div class="icon-wrap success"><i class="ti tabler-circle-check"></i></div><h4 class="fw-bold mb-2">결제가 완료됐습니다.</h4><p class="text-body-secondary mb-4">서비스가 시작됩니다.</p><div class="detail-table mb-4"><div class="detail-row"><span style="color:#6c757d">상품명</span><span style="font-weight:600">'+(p.goodname||'TAI Safe')+'</span></div><div class="detail-row"><span style="color:#6c757d">결제금액</span><span style="font-weight:600">'+fmt(p.price)+'</span></div><div class="detail-row"><span style="color:#6c757d">결제수단</span><span style="font-weight:600">'+(p.paymethod||'카드')+'</span></div>'+(p.applnum?'<div class="detail-row"><span style="color:#6c757d">승인번호</span><span style="font-weight:600">'+p.applnum+'</span></div>':'')+(p.expired_at?'<div class="detail-row"><span style="color:#6c757d">서비스 만료일</span><span style="font-weight:600">'+p.expired_at.slice(0,10)+'</span></div>':'')+'</div><button class="btn btn-primary btn-action w-100" onclick="goHome()">서비스 시작하기 →</button><div class="countdown" id="cd">'+sec+'초 후 자동 이동</div>';ti=setInterval(function(){sec--;var e=document.getElementById('cd');if(e)e.textContent=sec+'초 후 자동 이동';if(sec<=0){clearInterval(ti);goHome();}},1000);}
function renderFail(msg,oid){var rc=document.getElementById('rc');var retryUrl=getRetryUrl();rc.innerHTML='<div class="icon-wrap fail"><i class="ti tabler-circle-x"></i></div><h4 class="fw-bold mb-2">결제에 실패했습니다.</h4><p class="text-body-secondary mb-3">다시 시도해 주세요.</p><div class="detail-table mb-4"><div class="detail-row"><span style="color:#6c757d">사유</span><span style="color:#dc3545;font-weight:600">'+(msg||'오류')+'</span></div>'+(oid?'<div class="detail-row"><span style="color:#6c757d">주문번호</span><span style="font-size:.8rem">'+oid+'</span></div>':'')+'</div><div class="d-flex gap-2"><a href="'+retryUrl+'" target="_top" class="btn btn-primary btn-action flex-grow-1">다시 시도</a><a href="https://taieng.co.kr" target="_top" class="btn btn-outline-secondary btn-action">홈으로</a></div>';}
(function(){if(window.top!==window.self){try{window.top.location.replace(location.href);return;}catch(e){}}var p=getParams();if(!p.resultCode){renderFail('파라미터 없음');return;}if(p.resultCode==='00'||p.resultCode==='0000')renderOk(p);else renderFail(decodeURIComponent(p.msg||'오류코드 '+p.resultCode),p.oid);})();
</script>
</body></html>
