<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAI Safe 구독 결제</title>
  <style>
    body{margin:0;font-family:'Pretendard',sans-serif;background:#f8fafc;display:flex;justify-content:center;align-items:center;min-height:100vh}
    .box{text-align:center;padding:40px}
    .spinner{width:48px;height:48px;border:4px solid #e2e8f0;border-top:4px solid #0f172a;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
    @keyframes spin{to{transform:rotate(360deg)}}
    h2{color:#0f172a;font-size:20px;margin:0 0 8px}
    p{color:#64748b;font-size:14px;margin:0}
    .err{color:#dc2626;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:16px;margin-top:20px;display:none}
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <h2>이니시스 결제창으로 이동 중...</h2>
    <p>잠시만 기다려주세요.</p>
    <div class="err" id="errBox"></div>
  </div>

  <!-- 빌링키 발급 폼 (inilitepay.inicis.com 으로 POST) -->
  <form id="billingForm" method="POST" accept-charset="UTF-8" style="display:none">
    <input name="mid" type="hidden">
    <input name="goodName" type="hidden">
    <input name="buyerName" type="hidden">
    <input name="buyerTel" type="hidden">
    <input name="buyerEmail" type="hidden">
    <input name="orderId" type="hidden">
    <input name="price" type="hidden">
    <input name="timestamp" type="hidden">
    <input name="hashData" type="hidden">
    <input name="returnUrl" type="hidden">
  </form>

  <script>
    (function() {
      var API = 'https://api.taieng.co.kr';
      var params = new URLSearchParams(window.location.search);

      // 필수 파라미터 확인
      var userId = params.get('user_id');
      var productType = params.get('product_type') || 'SAAS_FACILITY';
      var amount = parseInt(params.get('amount') || '0');
      var goodname = params.get('goodname') || 'TAI Safe 구독';
      var planCode = params.get('plan_code') || '';
      var companyId = params.get('company_id') || '';
      var factoryId = params.get('factory_id') || '';
      var buyername = params.get('buyername') || '고객';
      var buyertel = params.get('buyertel') || '00000000000';
      var buyeremail = params.get('buyeremail') || '';

      if (!userId || !amount) {
        showError('필수 파라미터가 누락되었습니다. (user_id, amount)');
        return;
      }

      // 1. 백엔드 API 호출: 빌링 준비
      fetch(API + '/payments/inicis/billing/prepare', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          user_id: userId,
          product_type: productType,
          amount: amount,
          goodname: goodname,
          plan_code: planCode,
          company_id: companyId || undefined,
          factory_id: factoryId || undefined,
          buyername: buyername,
          buyertel: buyertel,
          buyeremail: buyeremail
        })
      })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.status !== 'success' || !res.data) {
          showError(res.detail || '결제 준비 실패');
          return;
        }
        var d = res.data;

        // 2. 폼 필드 설정
        var f = document.getElementById('billingForm');
        f.action = d.billing_issue_url;
        f.elements['mid'].value = d.mid;
        f.elements['goodName'].value = d.goodName;
        f.elements['buyerName'].value = d.buyerName;
        f.elements['buyerTel'].value = d.buyerTel;
        f.elements['buyerEmail'].value = d.buyerEmail;
        f.elements['orderId'].value = d.orderId;
        f.elements['price'].value = d.price;
        f.elements['timestamp'].value = d.timestamp;
        f.elements['hashData'].value = d.hashData;
        f.elements['returnUrl'].value = d.returnUrl;

        // 3. 자동 제출 (이니시스 빌키발급 페이지로 이동)
        setTimeout(function() { f.submit(); }, 500);
      })
      .catch(function(err) {
        showError('결제 준비 중 오류: ' + err.message);
      });

      function showError(msg) {
        document.getElementById('spinner').style.display = 'none';
        var box = document.getElementById('errBox');
        box.textContent = msg;
        box.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
