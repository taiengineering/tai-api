name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  unit-test:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    env:
      INTERNAL_API_SECRET: test
      ANTHROPIC_API_KEY: test
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages (pycairo / xhtml2pdf)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev pkg-config python3-dev libffi-dev gcc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install Python dependencies
        run: pip install -r requirements-test.txt

      - name: Time fetch main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Time Guard
        run: python scripts/check_time_contract.py --check
      - name: Time no-expansion
        run: python scripts/check_time_contract.py --check-expand origin/main
      - name: Time tests
        run: pytest tests/time/ -q --tb=short
      - name: Scheduler tests
        run: pytest tests/time/test_scheduler_option_c.py tests/time/test_scheduler_atomic_rpc.py tests/time/test_scheduler_gate_seed.py -q --tb=short
      - name: Migration static oracle
        run: pytest tests/time/test_kst_migration_static.py -q --tb=short
      - name: Cron manager auth tests
        run: pytest tests/test_cron_manager_auth.py -q --tb=short
      - name: Member company tests
        run: pytest tests/test_member_company.py -q --tb=short
      - name: Tax invoice request tests
        run: pytest tests/test_tax_invoice_request.py -q --tb=short
      - name: Tax invoice processor tests
        run: pytest tests/test_tax_invoice_processor.py -q --tb=short
      - name: Tax invoice adjustment tests
        run: pytest tests/test_tax_invoice_adjustment.py -q --tb=short
      - name: Payment proof type tests
        run: pytest tests/test_payment_proof_type.py -q --tb=short
      - name: Payment my projection tests
        run: pytest tests/test_payment_my_projection.py -q --tb=short

  db-integrity:
    name: "DB Integrity"
    if: false
    needs: unit-test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: DB 무결성 검증
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "skip: supabase secrets unset"
            exit 0
          fi
          python tests/check_db_integrity.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  mapping-coverage:
    name: "Mapping Coverage"
    if: false
    needs: unit-test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 매핑 커버리지 검증
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "skip: supabase secrets unset"
            exit 0
          fi
          python tests/check_mapping_coverage.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
