name: Deploy to Fly.io

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: '배포 대상'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging')
    concurrency: deploy-staging
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Staging
        run: flyctl deploy --remote-only --app tai-api-staging --config fly.staging.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Health Check
        run: |
          sleep 30
          STATUS=$(curl -s https://tai-api-staging.fly.dev/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo 'unknown')
          echo "Staging health: $STATUS"
          if [ "$STATUS" = "unknown" ]; then
            echo "::warning::Staging health check failed — production 배포 전 확인 필요"
          fi

  deploy-production:
    name: Deploy to Production (자동 롤백 포함)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Save current release (롤백용)
        id: save_release
        run: |
          PREV_IMAGE=$(flyctl releases list -a tai-api-prod --json | python3 -c "import sys,json; r=json.load(sys.stdin); print(r[0]['ImageRef'] if r else '')" 2>/dev/null || echo "")
          echo "prev_image=$PREV_IMAGE" >> $GITHUB_OUTPUT
          echo "이전 이미지: $PREV_IMAGE"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Production
        run: flyctl deploy --remote-only --app tai-api-prod
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health Check + 자동 롤백
        run: |
          echo "40초 대기 후 health check..."
          sleep 40
          STATUS=$(curl -s --max-time 10 https://api.taieng.co.kr/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo "dead")
          echo "Health status: $STATUS"

          if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "degraded" ]; then
            echo "✅ 배포 성공 — 서버 정상"
          else
            echo "❌ Health check 실패! 자동 롤백 시작..."
            PREV="${{ steps.save_release.outputs.prev_image }}"
            if [ -n "$PREV" ]; then
              flyctl deploy --image "$PREV" --app tai-api-prod
              echo "🔄 이전 버전으로 롤백 완료: $PREV"
            else
              echo "⚠️ 이전 이미지를 찾을 수 없어 롤백 불가. 수동 확인 필요."
            fi
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
