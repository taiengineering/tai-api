name: 법령엔진 무결성 검증

on:
  push:
    branches: [main]
    paths:
      - 'routers/legal_engine.py'
      - 'main.py'
      - 'tests/test_legal_engine*.py'
      - 'tests/check_db_integrity.py'
      - 'tests/check_mapping_coverage.py'
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────
  # Job 1: DB 무결성 빠른 검증 (약 3초)
  # Supabase REST API 직접 호출 — 배포 불필요
  # ─────────────────────────────────────────────────
  db-integrity:
    name: "[1] DB 무결성 검증"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests

      - name: DB 무결성 검증
        run: python tests/check_db_integrity.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  # ─────────────────────────────────────────────────
  # Job 2: 정적 매핑 커버리지 검증 (약 2초)
  # DB의 condition_code ↔ 엔진 context key 누락 탐지
  # ─────────────────────────────────────────────────
  mapping-coverage:
    name: "[2] 정적 매핑 커버리지 검증"
    needs: db-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests

      - name: 매핑 커버리지 검증
        run: python tests/check_mapping_coverage.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  # ─────────────────────────────────────────────────
  # Job 3: API 무결성 검증 (26건 + 52건 = 78건)
  # Railway 배포 완료 대기 후 실행
  # ─────────────────────────────────────────────────
  api-integrity:
    name: "[3] API 무결성 검증 (78건)"
    needs: mapping-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests

      - name: Railway 배포 완료 대기 (최대 5분)
        run: python tests/wait_for_deploy.py
        env:
          API_URL: ${{ secrets.API_URL }}

      - name: 기준 26건 검증 (FROZEN BASELINE)
        run: python tests/test_legal_engine.py --url ${{ secrets.API_URL }}

      - name: 추가 52건 검증
        run: python tests/test_legal_engine_52.py --url ${{ secrets.API_URL }}
