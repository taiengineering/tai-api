name: pytest

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: "pytest (unit tests)"
    runs-on: ubuntu-latest
    env:
      INTERNAL_API_SECRET: test
      ANTHROPIC_API_KEY: test
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages (pycairo / xhtml2pdf)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev pkg-config python3-dev libffi-dev gcc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install Python dependencies
        run: pip install -r requirements-test.txt

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short \
            --ignore=tests/check_db_integrity.py \
            --ignore=tests/check_mapping_coverage.py \
            --ignore=tests/test_legal_engine.py \
            --ignore=tests/test_legal_engine_52.py \
            --ignore=tests/test_legal_engine_layer.py \
            --ignore=tests/wait_for_deploy.py
