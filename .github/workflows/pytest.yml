name: pytest

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "pytest (unit tests)"
    runs-on: ubuntu-latest
    env:
      INTERNAL_API_SECRET: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: pytest 실행
        run: pytest tests/ -v --tb=short
