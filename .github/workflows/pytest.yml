name: pytest

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "pytest (unit tests)"
    runs-on: ubuntu-latest
    env:
      INTERNAL_API_SECRET: test
      ANTHROPIC_API_KEY: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          pip install fastapi uvicorn supabase python-dotenv requests \
                     httpx python-multipart jinja2 python-dateutil \
                     tenacity pandas openpyxl apscheduler resend \
                     openai sentry-sdk pytest

      - name: pytest 실행
        run: |
          pytest tests/test_construction*.py \
                 tests/test_law_rule_generator*.py \
                 tests/test_rule_gen*.py \
                 -v --tb=short
