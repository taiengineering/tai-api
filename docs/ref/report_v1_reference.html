=== 구조 요약 ===
PAGE 1: 표지 (Cover) — 네이비/다크 그라데이션, 회사정보 테이블
PAGE 2: 목차 + 면책조항
PAGE 3: SECTION 01 시설 개요 (기본정보/설비현황/운영현황)
PAGE 4: SECTION 02 적용 법령 및 사회적 배경

PAGE 8: SECTION 06 개선 권고사항 및 컨설팅 제안

=== 재사용 가능 CSS 컴포넌트 ===
- .cover, .cover-top, .cover-bottom — 표지 레이아웃
- .ph, .pf — 헤더/푸터
- .sh, .sh-accent, .sh-body — 섹션 헤더
- .ss — 서브섹션 제목
- .sc-wrap, .sc — 요약 카드 4열
- .badge (.b-high, .b-med, .b-low, .b-urgent) — 위험도 뱃지
- .ib (.blue, .gray, .red, .orange, .green) — 정보 박스
- .wb — 경고 박스
- .pb, .pb-row — 처벌 하이라이트
- .rc-wrap, .rc — 권고사항 카드
- .stat-hl, .shl-item — 통계 하이라이트
- .toc, .toc-row — 목차
- .bt — 본문 텍스트
- table (.th-dark, .th-blue, .th-red) — 테이블 스타일
- .td-label, .td-val, .td-red, .td-green — 셀 스타일
- @media print — 인쇄 최적화

company_name, building_type, report_date, receipt_no, report_type
business_no, ceo_name, address, industry_type, worker_count
area, floors, equip_summary, hazard_summary, work_hours
laws_count, appointment_count, inspection_count, urgent_count
csia_applicable (조건문)
laws_list, appointment_list, penalty_list (반복문)
urgent_actions, mid_actions (반복문)
