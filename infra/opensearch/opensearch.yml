cluster.name: tai-shared-search
node.name: tai-opensearch-node-1
discovery.type: single-node
network.host: 0.0.0.0

# Disable mmap — Railway hosts may have vm.max_map_count < 262144
# Uses niofs instead; acceptable for TAI search projection scale
node.store.allow_mmap: false

# index.number_of_shards / index.number_of_replicas are index-level settings.
# They are set per-index by opensearch_mapping.py (TAI mapping authority).
